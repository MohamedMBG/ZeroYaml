spring.application.name=control-plane
zeroyaml.runner.host=localhost
zeroyaml.runner.port=50051
zeroyaml.runner.ping-deadline=2s
zeroyaml.registration.port=50052
zeroyaml.runner.dispatch-deadline=5s
zeroyaml.github.webhook.max-payload-size=5MB
# zeroyaml.github.webhook.secret has no value here on purpose. Supply it from the
# environment (ZEROYAML_GITHUB_WEBHOOK_SECRET) or an approved secret store; startup
# fails when it is missing.
# A verified push reads the root file listing of its commit through the GitHub Git
# Trees API. Public repositories need no token; a private one needs a read-only
# token, supplied through ZEROYAML_GITHUB_API_TOKEN and never stored here. The
# Runner checks the source out from the location template; a local run can point
# it at file:///<path under ZEROYAML_RUNNER_LOCAL_SOURCE_ROOT>/{owner}/{name}.
zeroyaml.github.repository.api-base-url=${ZEROYAML_GITHUB_API_BASE_URL:https://api.github.com}
zeroyaml.github.repository.api-token=${ZEROYAML_GITHUB_API_TOKEN:}
zeroyaml.github.repository.api-timeout=10s
zeroyaml.github.repository.location-template=${ZEROYAML_GITHUB_REPOSITORY_LOCATION_TEMPLATE:https://github.com/{owner}/{name}.git}
# PostgreSQL holds connected repository metadata. The defaults match the local
# infra/compose.yaml service; every other environment overrides them. The
# password has no value here on purpose: supply it through
# ZEROYAML_DATABASE_PASSWORD or an approved secret store.
spring.datasource.url=${ZEROYAML_DATABASE_URL:jdbc:postgresql://localhost:5432/zeroyaml}
spring.datasource.username=${ZEROYAML_DATABASE_USERNAME:zeroyaml}
spring.datasource.password=${ZEROYAML_DATABASE_PASSWORD:}
# Bound waits so an unreachable or stalled database fails requests and startup
# instead of hanging them: 5 s to obtain a connection, 5 s per statement.
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s
# Job log ingress is disabled until zeroyaml.job-logs.port, certificate,
# private-key, and client-ca are supplied externally. It always requires mTLS;
# the legacy registration/status endpoint never serves JobLogService.
# Reading retained logs over GET /api/v1/jobs/{jobId}/logs is disabled (404)
# until a bearer token of at least 32 characters is supplied. It has no value
# here on purpose: logs can contain secrets printed by user commands.
# Enabling reading also requires native HTTPS through server.ssl and explicit
# server.forward-headers-strategy=NONE. Proxies must use HTTPS to this server;
# startup refuses a read token on a plaintext or forwarded-header-trusting server.
zeroyaml.job-logs.read.token=${ZEROYAML_JOB_LOGS_READ_TOKEN:}
# Job lifecycle events are an optional notification stream; PostgreSQL stays the
# source of truth. Publication is off by default, so the Control Plane does not
# need Kafka. The bootstrap default matches the local infra/compose.yaml broker.
zeroyaml.events.job-lifecycle.enabled=${ZEROYAML_JOB_EVENTS_ENABLED:false}
spring.kafka.bootstrap-servers=${ZEROYAML_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Bound every producer wait so an unreachable broker cannot hold the sender
# thread: 5 s for metadata or buffer space, 10 s per request, and 30 s in total
# before a delivery is reported as failed.
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000
