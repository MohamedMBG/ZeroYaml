name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Both jobs only read the checked-out sources. Nothing here writes to the
# repository, so no write scope is granted.
permissions:
  contents: read

# A new push supersedes the scan of the commit it replaced.
concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Gitleaks scans the commit range the pull request adds. The default
          # shallow checkout hides every commit but the newest, so a secret
          # introduced earlier in the branch would pass unnoticed.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Used to read pull request metadata and to annotate findings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ZeroYAML is a public repository owned by a personal account, which
          # the action serves without a licence key. Moving the repository into
          # an organization requires a GITLEAKS_LICENSE secret here.

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        # Semgrep ships as a Python wheel. The official container image is
        # Alpine based and cannot host GitHub's JavaScript actions, so the
        # scanner is installed onto the runner instead of used as a job
        # container.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # Pinned so a new upstream release cannot change the result of rerunning
        # an old pull request.
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Run Semgrep OSS rules
        # Generated protobuf bindings and build output are excluded because no
        # finding in them can be acted on.
        #
        # grpc-server-insecure-connection is excluded because the Runner gRPC
        # server is deliberately plaintext until transport security lands in
        # Phase 6 (issues #231-#242). Remove this exclusion with that work.
        run: |
          semgrep scan \
            --config p/default \
            --config p/java \
            --config p/golang \
            --config p/github-actions \
            --exclude runner/gen \
            --exclude '**/target' \
            --exclude-rule go.grpc.security.grpc-server-insecure-connection.grpc-server-insecure-connection \
            --metrics off \
            --error
